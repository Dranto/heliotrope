name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      # ESLint, Prettier and tsc caches: later runs on a PR only re-check changed files.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: tool-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: tool-cache-${{ hashFiles('package-lock.json') }}-
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Typecheck already ran above, so build with Vite only.
      - run: npx vite build
